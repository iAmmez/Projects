<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Language Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe5ec, #e0f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #1f2937;
    }

    .game-container {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #db2777;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 24px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat-card {
      flex: 1;
      min-width: 140px;
      background: #f9fafb;
      border-radius: 16px;
      padding: 14px;
      font-weight: bold;
    }

    .question-box {
      background: #fdf2f8;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .question-label {
      font-size: 1rem;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .question {
      font-size: 2.6rem;
      font-weight: bold;
      color: #111827;
      margin-bottom: 10px;
    }

    .hint {
      color: #6b7280;
      font-size: 0.95rem;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice-btn {
      background: #eef2ff;
      color: #1e1b4b;
      font-weight: bold;
    }

    .choice-btn:hover {
      background: #c7d2fe;
      transform: translateY(-2px);
    }

    .correct {
      background: #bbf7d0 !important;
      color: #166534 !important;
    }

    .wrong {
      background: #fecaca !important;
      color: #991b1b !important;
    }

    .feedback {
      min-height: 32px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .main-btn {
      background: #db2777;
      color: white;
      font-weight: bold;
    }

    .main-btn:hover {
      background: #be185d;
    }

    .secondary-btn {
      background: #f3f4f6;
      color: #374151;
      font-weight: bold;
    }

    .secondary-btn:hover {
      background: #e5e7eb;
    }

    .level-select {
      margin-bottom: 20px;
    }

    select {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
    }

    @media (max-width: 560px) {
      .game-container {
        padding: 22px;
      }

      h1 {
        font-size: 1.7rem;
      }

      .question {
        font-size: 2rem;
      }

      .choices {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="game-container">
    <h1>Japanese Language Game</h1>
    <p class="subtitle">Choose the correct meaning of the Japanese word.</p>
    <!-- Button -->
    <button onclick="playAudio()">もったいない</button>
    <!-- Audio file -->
    <audio id="myAudio" src="source/file1.mp3"></audio>
    
    <div class="level-select">
      <label for="level">Level: </label>
      <select id="level">
        <option value="easy">Easy: Hiragana & Basic Words</option>
        <option value="medium">Medium: Daily Vocabulary</option>
        <option value="hard">Hard: Grammar Meaning</option>
      </select>
    </div>

    <section class="stats">
      <div class="stat-card">Score: <span id="score">0</span></div>
      <div class="stat-card">Question: <span id="questionNumber">1</span>/10</div>
      <div class="stat-card">Best: <span id="bestScore">0</span></div>
    </section>

    <section class="question-box">
      <p class="question-label">What does this mean?</p>
      <div class="question" id="questionText">こんにちは</div>
      <p class="hint" id="hintText">Select one answer below.</p>
    </section>

    <section class="choices" id="choices"></section>

    <p class="feedback" id="feedback"></p>

    <section class="controls">
      <button class="main-btn" id="nextBtn">Next</button>
      <button class="secondary-btn" id="restartBtn">Restart</button>
    </section>
  </main>

  <script>
    function playAudio() {
      const audio = document.getElementById("myAudio");
      audio.play();
    }
    
    const quizData = {
      easy: [
        { jp: "こんにちは", answer: "Hello", options: ["Hello", "Goodbye", "Thank you", "Sorry"] },
        { jp: "ありがとう", answer: "Thank you", options: ["Thank you", "Excuse me", "Good night", "Please"] },
        { jp: "ねこ", answer: "Cat", options: ["Dog", "Cat", "Bird", "Fish"] },
        { jp: "いぬ", answer: "Dog", options: ["Dog", "Cat", "Horse", "Rabbit"] },
        { jp: "みず", answer: "Water", options: ["Water", "Tea", "Milk", "Juice"] },
        { jp: "ごはん", answer: "Rice / Meal", options: ["Rice / Meal", "Bread", "Meat", "Fruit"] },
        { jp: "せんせい", answer: "Teacher", options: ["Student", "Teacher", "Doctor", "Friend"] },
        { jp: "がくせい", answer: "Student", options: ["Student", "Teacher", "Child", "Parent"] },
        { jp: "あさ", answer: "Morning", options: ["Morning", "Afternoon", "Evening", "Night"] },
        { jp: "よる", answer: "Night", options: ["Morning", "Noon", "Night", "Weekend"] }
      ],
      medium: [
        { jp: "駅（えき）", answer: "Station", options: ["School", "Station", "Hospital", "Library"] },
        { jp: "会社（かいしゃ）", answer: "Company", options: ["Company", "Classroom", "Airport", "Restaurant"] },
        { jp: "電車（でんしゃ）", answer: "Train", options: ["Car", "Train", "Bicycle", "Bus"] },
        { jp: "買います", answer: "To buy", options: ["To buy", "To sell", "To read", "To write"] },
        { jp: "食べます", answer: "To eat", options: ["To drink", "To eat", "To go", "To sleep"] },
        { jp: "飲みます", answer: "To drink", options: ["To drink", "To see", "To listen", "To speak"] },
        { jp: "高い", answer: "Expensive / Tall", options: ["Cheap", "Expensive / Tall", "Small", "Cold"] },
        { jp: "安い", answer: "Cheap", options: ["Fast", "Cheap", "Heavy", "New"] },
        { jp: "忙しい", answer: "Busy", options: ["Free", "Busy", "Easy", "Quiet"] },
        { jp: "楽しい", answer: "Fun", options: ["Difficult", "Fun", "Boring", "Far"] }
      ],
      hard: [
        { jp: "〜とき", answer: "When...", options: ["When...", "Because...", "Although...", "In order to..."] },
        { jp: "〜と", answer: "When/if one action naturally leads to a result", options: ["When/if one action naturally leads to a result", "For the purpose of", "Before doing", "Without doing"] },
        { jp: "〜ために", answer: "In order to / for the purpose of", options: ["In order to / for the purpose of", "Even though", "After doing", "Must not"] },
        { jp: "〜のに", answer: "For doing / to do", options: ["For doing / to do", "Because of", "If possible", "Too much"] },
        { jp: "〜てください", answer: "Please do...", options: ["Please do...", "Do not do...", "I want to do...", "I have done..."] },
        { jp: "〜てもいいです", answer: "May do...", options: ["May do...", "Must do...", "Cannot do...", "Did not do..."] },
        { jp: "〜てはいけません", answer: "Must not do...", options: ["Must not do...", "May do...", "Want to do...", "Have to do..."] },
        { jp: "〜なければなりません", answer: "Must do...", options: ["Must do...", "May do...", "Do not do...", "Can do..."] },
        { jp: "〜たことがあります", answer: "Have experienced doing...", options: ["Have experienced doing...", "Will do soon", "Must do", "Cannot do"] },
        { jp: "〜ましょう", answer: "Let's do...", options: ["Let's do...", "Do not do...", "I did...", "I cannot do..."] }
      ]
    };

    const questionText = document.getElementById("questionText");
    const hintText = document.getElementById("hintText");
    const choicesBox = document.getElementById("choices");
    const feedback = document.getElementById("feedback");
    const scoreText = document.getElementById("score");
    const questionNumberText = document.getElementById("questionNumber");
    const bestScoreText = document.getElementById("bestScore");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");
    const levelSelect = document.getElementById("level");

    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let bestScore = Number(localStorage.getItem("japaneseGameBestScore")) || 0;

    bestScoreText.textContent = bestScore;

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function startGame() {
      const level = levelSelect.value;
      questions = shuffle(quizData[level]).slice(0, 10);
      currentQuestionIndex = 0;
      score = 0;
      answered = false;
      scoreText.textContent = score;
      questionNumberText.textContent = 1;
      feedback.textContent = "";
      nextBtn.textContent = "Next";
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      feedback.textContent = "";
      choicesBox.innerHTML = "";

      const current = questions[currentQuestionIndex];
      questionText.textContent = current.jp;
      hintText.textContent = "Select the correct English meaning.";
      questionNumberText.textContent = currentQuestionIndex + 1;

      shuffle(current.options).forEach(option => {
        const button = document.createElement("button");
        button.className = "choice-btn";
        button.textContent = option;
        button.addEventListener("click", () => checkAnswer(button, option));
        choicesBox.appendChild(button);
      });
    }

    function checkAnswer(button, selectedAnswer) {
      if (answered) return;
      answered = true;

      const correctAnswer = questions[currentQuestionIndex].answer;
      const allButtons = document.querySelectorAll(".choice-btn");

      allButtons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === correctAnswer) {
          btn.classList.add("correct");
        }
      });

      if (selectedAnswer === correctAnswer) {
        score++;
        scoreText.textContent = score;
        feedback.textContent = "Correct! よくできました！";
        feedback.style.color = "#166534";
      } else {
        button.classList.add("wrong");
        feedback.textContent = `Incorrect. The answer is: ${correctAnswer}`;
        feedback.style.color = "#991b1b";
      }
    }

    function nextQuestion() {
      if (!answered) {
        feedback.textContent = "Please choose an answer first.";
        feedback.style.color = "#92400e";
        return;
      }

      currentQuestionIndex++;

      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        endGame();
      }
    }

    function endGame() {
      questionText.textContent = "Game Finished!";
      hintText.textContent = `Your final score is ${score} out of ${questions.length}.`;
      choicesBox.innerHTML = "";
      feedback.style.color = "#1f2937";

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("japaneseGameBestScore", bestScore);
        bestScoreText.textContent = bestScore;
        feedback.textContent = "New best score! すばらしい！";
      } else {
        feedback.textContent = "Good job! Try again to improve your score.";
      }

      nextBtn.textContent = "Play Again";
      answered = true;
      currentQuestionIndex = questions.length - 1;
    }

    nextBtn.addEventListener("click", () => {
      if (nextBtn.textContent === "Play Again") {
        startGame();
      } else {
        nextQuestion();
      }
    });

    restartBtn.addEventListener("click", startGame);
    levelSelect.addEventListener("change", startGame);

    startGame();
  </script>
</body>
</html>
